# Keeps the Render free web service from spinning down during active hours.
# Render free services sleep after ~15 min idle, so we ping every 10 min.
#
# Window: ~09:00–00:20 IST (03:00–18:50 UTC). Outside that the service is
# allowed to sleep, which keeps monthly instance-hours well under the 750
# free-tier cap (~480 h/month vs ~720 for always-on).
#
# GitHub sometimes delays scheduled runs a few minutes under load; the 10-min
# cadence has enough margin. If you still see cold starts, drop to '*/7'.
name: keep-alive

on:
  schedule:
    - cron: "*/10 3-18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sSf --max-time 30 --retry 2 --retry-delay 5 \
            "${{ vars.KEEP_ALIVE_URL || 'https://insell-be.onrender.com/api/health' }}"
