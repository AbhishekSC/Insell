# Two sweeps for scheduled community calls, both every ~5 minutes (GitHub's
# practical minimum) — a 10-minute reminder window and a duration-limited
# auto-end don't tolerate the daily/weekly cadence the other jobs use.
# Auth is the same shared secret header (repo secret CRON_SECRET, matching
# server env CRON_SECRET) as weekly-digest and stalled-deals-nudge.
name: community-call-reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep scheduled call reminders
        run: |
          curl -sSf --max-time 60 --retry 2 --retry-delay 10 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.API_BASE_URL || 'https://insell-be.onrender.com' }}/api/community-calls/cron/reminders"
      - name: Sweep stale/empty duration-limited calls
        run: |
          curl -sSf --max-time 60 --retry 2 --retry-delay 10 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.API_BASE_URL || 'https://insell-be.onrender.com' }}/api/community-calls/cron/auto-end"
