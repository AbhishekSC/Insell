<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearMySpace | Social Real Estate Marketplace</title>
    <meta name="description" content="Discover verified homes, direct owner connections, smart commute times, and authentic community reviews on NearMySpace." />
    <meta name="theme-color" content="#2563eb" />
    <!-- Preconnect to image CDN and map tile server for faster first paint -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <meta name="google-site-verification" content="4xblI9VJ_61godQRI_G8nS8bXsF540ndqCSeiMCqCCI" />

    <!-- Google Site Name & Organization Structured Data (Fixes "Vercel" site name on Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NearMySpace",
        "alternateName": ["Near My Space", "NearMySpace Real Estate", "Insell"],
        "url": "https://nearmy-space.vercel.app/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NearMySpace",
        "url": "https://nearmy-space.vercel.app/",
        "logo": "https://nearmy-space.vercel.app/favicon.png"
      }
    </script>

    <!-- Open Graph Fallback -->
    <meta property="og:site_name" content="NearMySpace" />
    <meta property="og:title" content="NearMySpace | Social Real Estate Marketplace" />
    <meta property="og:description" content="Discover verified homes, direct owner connections, smart commute times, and authentic community reviews on NearMySpace." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-splash.png" />

    <!-- Twitter Card Fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NearMySpace | Social Real Estate Marketplace" />
    <meta name="twitter:description" content="Discover verified homes, direct owner connections, smart commute times, and authentic community reviews on NearMySpace." />
    <meta name="twitter:image" content="/logo-splash.png" />
    <style>
      /* Pre-React splash. Lives inside #root, so React removes it on first
         render — no JS teardown needed. Kept tiny and inline so it paints
         before the (heavy) app bundle finishes parsing. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f4f5f7;
        z-index: 9999;
      }
      #app-splash .brand {
        width: 132px;
        height: auto;
        animation: splash-pop 900ms cubic-bezier(0.22, 1, 0.36, 1) both,
          splash-breathe 2.4s ease-in-out 900ms infinite;
      }
      #app-splash .bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      #app-splash .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2563eb;
        animation: splash-slide 1.15s ease-in-out infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.82); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      /* Dark only follows an explicit saved choice (see ThemeProvider —
         the app defaults to light regardless of prefers-color-scheme), so
         this is a class the inline script below adds to <html>, never a
         media query — set before body parses, so no flash either way. */
      html.theme-dark #app-splash { background: #14161a; }
      html.theme-dark #app-splash .bar { background: rgba(255, 255, 255, 0.1); }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .brand { animation: splash-pop 400ms ease-out both; }
        #app-splash .bar::after { animation-duration: 2s; }
      }
    </style>
    <script>
      // Match the splash background to the saved theme so there's no flash
      // when the themed app renders over it. Mirrors ThemeProvider's own
      // default: light unless the user explicitly chose dark before.
      try {
        if (localStorage.getItem("syncspace-theme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img class="brand" src="/logo-splash.png" alt="Insell" />
        <div class="bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
